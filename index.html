<title>Free WiFi</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background:#000; display:flex; justify-content:center; align-items:center; min-height:100vh; overflow:hidden; }
  #wrap { position:relative; width:100%; max-width:680px; }
  #main { width:100%; display:block; }
  #btn { position:absolute; left:50%; bottom:8%; transform:translateX(-50%); background:#22c55e; color:#fff; border:0; border-radius:40px; padding:16px 44px; font:700 22px Arial,sans-serif; box-shadow:0 6px 24px rgba(0,0,0,.6); cursor:pointer; }
  #btn:active { transform:translateX(-50%) scale(.95); }
  #boo { position:fixed; inset:0; display:none; background:#000; z-index:99; justify-content:center; align-items:center; flex-direction:column; }
  #boo img { width:100%; height:100%; object-fit:cover; position:absolute; inset:0; filter:contrast(1.4) saturate(1.3) brightness(1.1); animation:zoom .25s ease-out forwards, shake .08s infinite; }
  #boo::after { content:''; position:absolute; inset:0; background:radial-gradient(circle,transparent 30%,rgba(120,0,0,.85) 100%); animation:flash .3s steps(2) 6; }
  #boo h1 { position:relative; z-index:2; font-family:Impact,'Arial Black',sans-serif; font-size:22vw; color:#ff1a1a; text-shadow:0 0 20px #000,0 0 40px #f00; transform:rotate(-6deg); animation:pulse .2s infinite alternate; }
  @keyframes zoom { from{transform:scale(.3)} to{transform:scale(1.15)} }
  @keyframes shake { 0%{translate:-6px 4px} 50%{translate:6px -4px} 100%{translate:-4px -6px} }
  @keyframes flash { 0%{opacity:0} 100%{opacity:1} }
  @keyframes pulse { from{scale:1} to{scale:1.15} }
</style>

  var ctx;
  function scream(){
    try{
      ctx = ctx || new (window.AudioContext||window.webkitAudioContext)();
      var o = ctx.createOscillator(), g = ctx.createGain();
